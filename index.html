<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View PDF Document</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: sans-serif;
            background-color: #f4f4f4;
        }
        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        .header {
            background: #0070f3;
            color: white;
            padding: 15px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        /* Desktop View */
        iframe {
            flex-grow: 1;
            border: none;
            width: 100%;
        }
        /* Mobile View Fix */
        .mobile-download {
            display: none;
            text-align: center;
            padding: 50px 20px;
        }
        .btn {
            display: inline-block;
            background: #0070f3;
            color: white;
            padding: 15px 25px;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            margin-top: 20px;
        }

        @media (max-width: 768px) {
            iframe {
                display: none; /* Hide iframe on small screens to prevent errors */
            }
            .mobile-download {
                display: block; /* Show a nice button instead */
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Vincent Document Viewer</h1>
    </div>

    <iframe src="./2025-12-24-06-00-00-3210238-en.pdf"></iframe>

    <div class="mobile-download">
        <p>This PDF is best viewed in a full-screen reader on mobile devices.</p>
        <a href="./2025-12-24-06-00-00-3210238-en.pdf" class="btn">Open PDF in Full Screen</a>
    </div>
</div>

</body>
</html>
